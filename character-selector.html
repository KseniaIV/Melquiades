<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Character Selector</title>
    <style>
        body { font-family: system-ui; margin: 2rem; background: #0d0d14; color: #d4d4e8; }
        .selector { max-width: 600px; margin: 0 auto; }
        .character-card { 
            border: 1px solid #2a2a3e; 
            padding: 1rem; 
            margin: 0.5rem 0; 
            cursor: pointer;
            border-radius: 8px;
            background: #1a1a28;
            transition: all 0.2s ease;
        }
        .character-card.active { 
            border-color: #7c6af7; 
            background: #1e1e2f; 
        }
        .character-card:hover { 
            border-color: #7c6af7; 
            transform: translateY(-1px);
        }
        .name { font-weight: bold; margin-bottom: 0.5rem; color: #d4d4e8; }
        .description { color: #555566; font-size: 0.9rem; }
        .model { color: #4ecdc4; font-size: 0.8rem; margin-top: 0.5rem; }
        .status { 
            padding: 0.5rem; 
            margin: 1rem 0; 
            border-radius: 4px;
        }
        .status.success { background: #0d3d2d; color: #3fb950; border: 1px solid #3fb950; }
        .status.error { background: #441e1e; color: #f85149; border: 1px solid #f85149; }
        h1 { color: #7c6af7; text-align: center; margin-bottom: 2rem; }
        .back-link { 
            display: inline-block; 
            margin: 1rem 0; 
            color: #4ecdc4; 
            text-decoration: none; 
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="selector">
        <h1>🎭 AI Character Selector</h1>
        <p style="text-align: center; color: #555566; margin-bottom: 2rem;">Choose a character to use for AI interactions in Melquíades.</p>
        
        <a href="/demo-panel.html" class="back-link">← Back to Melquíades</a>
        
        <div id="status" class="status" style="display: none;"></div>
        <div id="characters"></div>
    </div>

    <script>
        async function loadCharacters() {
            try {
                const response = await fetch('/api/characters');
                const data = await response.json();
                
                const container = document.getElementById('characters');
                container.innerHTML = '';
                
                data.characters.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'character-card';
                    if (name === data.active) {
                        card.classList.add('active');
                    }
                    
                    card.innerHTML = `
                        <div class="name">${name}</div>
                        <div class="description">Click to select this character</div>
                        <div class="model">Currently ${name === data.active ? 'active' : 'inactive'}</div>
                    `;
                    
                    card.onclick = () => selectCharacter(name);
                    container.appendChild(card);
                });
                
                showStatus(`Loaded ${data.characters.length} characters`, 'success');
            } catch (error) {
                showStatus('Error loading characters: ' + error.message, 'error');
            }
        }
        
        async function selectCharacter(name) {
            try {
                const response = await fetch('/api/characters', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ character: name })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to switch character');
                }
                
                const data = await response.json();
                showStatus(`Switched to ${name}`, 'success');
                
                // Update UI
                document.querySelectorAll('.character-card').forEach(card => {
                    card.classList.remove('active');
                    if (card.querySelector('.name').textContent === name) {
                        card.classList.add('active');
                    }
                });
                
            } catch (error) {
                showStatus('Error switching character: ' + error.message, 'error');
            }
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        // Load on page load
        loadCharacters();
    </script>
</body>
</html>
