# Postgres for Melquíades — schema and seed applied automatically on first start.
#   docker compose up -d
#   $env:DATABASE_URL = "postgres://melquiades:melquiades@localhost:55432/melquiades?sslmode=disable"
#   go run .
#
# To wipe and rebuild from scratch: docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: melquiades-db
    environment:
      POSTGRES_USER: melquiades
      POSTGRES_PASSWORD: melquiades
      POSTGRES_DB: melquiades
    ports:
      # Host port 55432 to avoid clashing with a native PostgreSQL on 5432.
      - "55432:5432"
    volumes:
      - melquiades-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./sql/seed-imagination.sql:/docker-entrypoint-initdb.d/03-imagination.sql:ro
      - ./sql/seed-myths.sql:/docker-entrypoint-initdb.d/04-myths.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melquiades -d melquiades"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  melquiades-data:
